name: Release

# Consumers pin `github:worksong-ai/design#vX.Y.Z`, never a branch. This tags
# main at the version in package.json once the same checks CI runs pass, and
# cuts a GitHub release. Run it from Actions -> Release -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit on main to release (default: main's head)
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
          fetch-depth: 0

      - name: Must be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main || { echo "::error::$(git rev-parse HEAD) is not on main"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run test:web
      - run: npm run build

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null; then
            echo "::error::$version already exists; bump package.json first"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$version" -m "@worksong/design $version"
          git push origin "refs/tags/$version"
          gh release create "$version" --title "@worksong/design $version" --generate-notes --verify-tag
          echo "Released $version at $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
